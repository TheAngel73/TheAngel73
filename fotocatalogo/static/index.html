<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Provinia</title>
<link rel="icon" href="/static/icona.png">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header id="topbar">
  <div class="brand"><img src="/static/icona.png" alt="">Provinia</div>
  <button id="btn-catalog" title="Catalogo">…</button>
  <div class="menu-wrap">
    <button id="btn-library">Libreria<svg class="i chevd" viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 6.5l3.5 3.5 3.5-3.5"/></svg></button>
    <div class="menu" id="menu-library" hidden>
      <button data-act="add-folder">Aggiungi cartella di foto…</button>
      <button data-act="import-lr">Importa catalogo Lightroom…</button>
      <hr>
      <button data-act="dups">Trova duplicati…</button>
      <button data-act="pregen">Genera anteprime della vista corrente</button>
      <button data-act="relocate">Cambia percorso del NAS…</button>
      <hr>
      <button data-act="del-rejected" class="danger-item">Elimina dal disco tutte le scartate…</button>
      <hr>
      <button data-act="help">Scorciatoie da tastiera</button>
    </div>
  </div>
  <span class="tsep"></span>
  <input id="search" type="search" placeholder="Cerca…" title="Cerca per nome del file, parola chiave, cartella o luogo">
  <button id="btn-filters" type="button" title="Filtri: luogo, etichetta, bandierina, anno, formato"><svg class="i" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 4h11M4.5 8h7M6.5 12h3"/></svg>Filtri<span id="filters-count"></span></button>
  <div id="filters">
  <button id="f-geo" type="button" title="Filtra per luogo: mappa delle foto con posizione GPS"><svg class="i" viewBox="0 0 16 16"><path d="M8 14.2s4.6-4.3 4.6-7.9A4.6 4.6 0 0 0 3.4 6.3c0 3.6 4.6 7.9 4.6 7.9z"/><circle cx="8" cy="6.3" r="1.6"/></svg><span id="f-geo-label">Luogo</span></button>
  <select id="f-label" title="Etichetta colore">
    <option value="">Etichette</option>
    <option value="red">Rossa</option><option value="yellow">Gialla</option>
    <option value="green">Verde</option><option value="blue">Blu</option>
    <option value="purple">Viola</option><option value="none">Nessuna</option>
  </select>
  <select id="f-flag" title="Bandierina">
    <option value="">Bandierine</option><option value="1">Scelte</option>
    <option value="0">Senza bandierina</option><option value="-1">Scartate</option>
  </select>
  <select id="f-year" title="Anno"><option value="">Anno</option></select>
  <select id="f-ext" title="Tipo di file">
    <option value="">Formato</option>
    <option value="jpg,jpeg">JPEG</option>
    <option value="heic,heif">HEIC</option>
    <option value="psd,psb">PSD</option>
    <option value="tif,tiff">TIFF</option>
    <option value="dng">DNG</option>
    <option value="mov,mp4,m4v,avi,mkv,mts,m2ts,3gp,mpg,mpeg,wmv,webm">Video</option>
    <option value="nef,nrw,cr2,cr3,crw,arw,srf,sr2,raf,orf,rw2,pef,srw,x3f,3fr,iiq,erf,mos,mrw,raw,rwl,kdc,dcr,mef">RAW proprietari</option>
  </select>
  </div>
  <span class="tsep"></span>
  <select id="sort" title="Ordina">
    <option value="date:asc">Data scatto ↑</option>
    <option value="date:desc">Data scatto ↓</option>
    <option value="name:asc">Nome file</option>
    <option value="added:desc">Aggiunte di recente</option>
    <option value="rating:desc">Valutazione</option>
  </select>
  <button id="clear-filters" title="Togli tutti i filtri" hidden>✕</button>
  <span class="tsep"></span>
  <label class="zoomwrap" title="Dimensione miniature"><svg class="i" viewBox="0 0 16 16"><rect x="5" y="5" width="6" height="6" rx="1"/></svg><input id="zoom" type="range" min="100" max="360" value="180"><svg class="i big" viewBox="0 0 16 16"><rect x="2.5" y="2.5" width="11" height="11" rx="1.5"/></svg></label>
</header>

<main id="layout">
  <div id="side-grip" title="Trascina per cambiare la larghezza · doppio clic: larghezza normale"></div>
  <div id="info-grip" title="Trascina per cambiare la larghezza · doppio clic: larghezza normale"></div>
  <aside id="sidebar">
    <section>
      <h3>Catalogo</h3>
      <ul class="tree" id="catalog-list"></ul>
    </section>
    <section>
      <h3>Raccolte <span class="h-actions">
        <button class="mini" data-act="new-coll" title="Nuova raccolta"><svg class="i" viewBox="0 0 16 16"><path d="M8 3.5v9M3.5 8h9"/></svg></button>
        <button class="mini" data-act="new-set" title="Nuovo set di raccolte"><svg class="i" viewBox="0 0 16 16"><rect x="2" y="3" width="12" height="3.2" rx=".9"/><path d="M3.2 6.2v6a1 1 0 0 0 1 1h7.6a1 1 0 0 0 1-1v-6"/><path d="M6.4 8.7h3.2"/></svg></button></span></h3>
      <input class="filter" id="coll-filter" placeholder="Filtra raccolte…">
      <ul class="tree" id="coll-tree"></ul>
    </section>
    <section>
      <h3>Cartelle</h3>
      <label class="small"><input type="checkbox" id="deep" checked> Includi sottocartelle</label>
      <ul class="tree" id="folder-tree"></ul>
    </section>
    <section>
      <h3>Parole chiave</h3>
      <input class="filter" id="kw-filter" placeholder="Filtra parole chiave…">
      <ul class="tree" id="kw-tree"></ul>
    </section>
  </aside>

  <section id="center">
    <div id="viewbar"><span id="view-title">Tutte le foto</span> <span id="view-count"></span>
      <span id="active-filters"></span>
      <span id="sel-count"></span>
      <button id="btn-convert-all" class="mini-btn" hidden>Converti tutti (RAW e PNG)…</button>
      <button id="btn-remove-missing" class="mini-btn" hidden>Rimuovi tutte dal catalogo…</button>
      <button id="btn-rename-all" class="mini-btn" hidden>Rinomina tutte…</button>
      <button id="btn-delete-rejected" class="mini-btn" hidden>Elimina tutte dal disco…</button></div>
    <div id="grid-scroll" tabindex="0"><div id="grid-space"></div></div>
  </section>

  <aside id="info"></aside>
</main>

<footer id="jobs"></footer>

<div id="loupe" hidden>
  <div id="loupe-stage"><img id="loupe-img" alt="" draggable="false">
    <video id="loupe-video" controls playsinline preload="metadata" hidden></video>
    <div id="loupe-novideo" hidden><p>Questo formato video non si può riprodurre qui.</p>
      <button type="button" class="primary">Apri con l'app predefinita</button></div></div>
  <div id="loupe-strip" aria-label="Foto vicine"><div class="strip-track"></div></div>
  <div id="loupe-bar"><span id="loupe-name"></span>
    <span class="loupe-tools"><button id="loupe-rotl" title="Ruota a sinistra (⌘←)"><svg class="i" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.2 7.4A5 5 0 1 1 4.6 11.6"/><path d="M3 3.8v3.8h3.8"/></svg></button><button id="loupe-rotr" title="Ruota a destra (⌘→)"><svg class="i" viewBox="0 0 16 16" aria-hidden="true"><path d="M12.8 7.4A5 5 0 1 0 11.4 11.6"/><path d="M13 3.8v3.8H9.2"/></svg></button>
      <label class="expo" title="Esposizione solo per la visione: il file non viene modificato. Doppio clic per azzerare">☀
        <input type="range" id="loupe-expo" min="-3" max="3" step="0.1" value="0"><span id="loupe-expo-val">0 EV</span></label></span>
    <span id="loupe-zoom"></span>
    <span class="hint" id="loupe-hint">clic: adatta/100% · doppio clic: griglia · rotellina: zoom · ← →</span></div>
  <button id="loupe-prev" class="nav" title="Foto precedente (←)"><svg class="i" viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3.5L5.5 8l4.5 4.5"/></svg></button>
  <button id="loupe-next" class="nav" title="Foto successiva (→)"><svg class="i" viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3.5L10.5 8 6 12.5"/></svg></button>
</div>

<dialog id="dlg"><form method="dialog" id="dlg-form"></form></dialog>
<div id="toast" hidden></div>
<div id="catscreen" hidden></div>
<div id="dupscreen" hidden></div>
<div id="mapscreen" hidden></div>

<script>
// Errori dell'interfaccia: finiscono nel registro (Aiuto › Mostra registro) e in una
// barra rossa in basso, così un problema su un altro Mac si vede e si può diagnosticare.
(function () {
  function report(msg) {
    try { fetch("/api/clientlog", {method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({msg: String(msg), ua: navigator.userAgent})}); } catch (e) {}
    var b = document.getElementById("fatal");
    if (!b) { b = document.createElement("div"); b.id = "fatal"; document.body.appendChild(b); b.onclick = function () { b.remove(); }; }
    b.textContent = "Errore nell'interfaccia: " + msg + " (clic per chiudere; dettagli in Aiuto › Mostra registro)";
  }
  window.addEventListener("error", function (e) {
    // avviso innocuo di WebKit, non è un errore
    if (/ResizeObserver loop/.test(e.message || "")) return;
    report((e.message || "errore") + (e.filename ? " — " + e.filename.split("/").pop() + ":" + e.lineno : "")); });
  window.addEventListener("unhandledrejection", function (e) { report((e.reason && (e.reason.stack || e.reason.message)) || e.reason); });
})();
</script>
<script src="/static/app.js"></script>
<script src="/static/mappa.js"></script>
</body>
</html>
